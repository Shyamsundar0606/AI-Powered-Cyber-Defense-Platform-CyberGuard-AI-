services:
  backend:
    build:
      context: ./backend
    container_name: cyberguard-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: ./frontend
    container_name: cyberguard-ai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
